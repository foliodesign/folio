name: Feature request
description: Explain a task Folio should help you complete.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Do not include private designs, account details or file URLs. Folio cannot bypass Figma restrictions or modify its code.
  - type: textarea
    id: task
    attributes:
      label: Task and current limitation
      description: What are you trying to do, and what prevents it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
  - type: input
    id: device
    attributes:
      label: iPad model
      description: Enter not available if you do not have a device.
    validations:
      required: true
  - type: input
    id: ipados
    attributes:
      label: iPadOS version
      description: Enter not available if unknown.
    validations:
      required: true
  - type: input
    id: folio
    attributes:
      label: Folio version, build or commit
      description: Enter not installed if you have not used Folio.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed Developer Tools report
      description: If relevant and available, attach a report after removing private content and identifiers. Otherwise say not applicable or unavailable.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: My text and attachments contain no private designs, account data or credentials.
          required: true
