<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'"
    />
    <title>Folio focus lab</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font: 17px system-ui;
        background: #eee;
      }
      h1,
      p {
        margin: 20px;
      }
      input {
        position: absolute;
        top: 75%;
        left: 70%;
        width: 160px;
        font-size: 12px;
      }
      canvas {
        position: absolute;
        top: 30%;
        left: 3%;
        width: 94%;
        height: 180px;
        background: #ddd;
        touch-action: none;
      }
      output {
        position: absolute;
        top: 270px;
        left: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Folio focus lab</h1>
    <p>
      Offline focus fixture. Tap the small field. No sample text is exported.
    </p>
    <input aria-label="Small focus field" type="text" />
    <canvas aria-label="Focus canvas"></canvas>
    <output id="contacts">contactsPeak=0</output>
  </body>
</html>
